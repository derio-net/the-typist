# Acceptance matrix — the registry of business-level acceptance tests and
# where each is verified. Rendered by `fr acceptance report`; no CI is configured,
# so `fr acceptance check` runs locally and no row is `ci`.
#
# Row schema:
#   id:         kebab-case, stable
#   capability: grouping (tables render in first-seen order)
#   acceptance: the business-level statement
#   origin:     list of "repo:path[#anchor]" refs (spec §, design doc)
#   levels:     unit/api/int/ui → list of "repo:path[#test_name]" test refs
#               (a .py fragment names a test, pytest-style: #TestX::test_y —
#               never a #L<n> line, which rots as code moves; gh#531)
#               ([] = level does not verify this row)
#   status:     ci | scheduled | skipped | not-implemented | failing
#     ci               automated on every PR — cannot drift silently
#     scheduled        automated on cron/path triggers
#     skipped          verification exists but does not run in CI (proven
#                      live once / manual walk) → CI warning, backfill owed
#     not-implemented  no test or surface exists yet → CI warning
#     failing          known red → `fr acceptance check` exits 2, CI FAILS
#   notes:      evidence detail, drift context
#
# Rule: .claude/rules/acceptance-matrix.md — update rows in the SAME PR that
# changes a Test Plan, adds tests, ships a surface, or touches CI.
# Add rows with `fr acceptance add` (schema-validated). It inserts a row after
# the last row of the same capability, and appends to the end of this file only
# for a new capability — so keep `rows:` as the LAST top-level key.

schema_version: 3
org: derio-net
repo: the-typist
rows:
  - id: list-schema
    capability: Lists
    acceptance: A YAML list of typed Records is accepted only if it satisfies the schema
      and per-type example rules; violations are reported per record.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R1
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R2
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R3
    levels:
      unit:
      - the-typist:tests/schema/record.test.ts
      - the-typist:tests/schema/list.test.ts
      - the-typist:tests/schema/typeable.test.ts
      - the-typist:tests/schema/strictness.test.ts
      - the-typist:tests/tools/validate.test.ts
    status: skipped
    notes: Built in plan 1 (phases 1, 5); unit tests run locally via npm test, no CI
      configured. Build-time half of R11 (vite plugin) covered; runtime file-picker
      half is plan 2.
  - id: list-loading
    capability: Lists
    acceptance: Repo lists are validated at build and playable on the hosted site, and
      a player can load their own YAML list, which is rejected with errors if invalid.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R11
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R12
    levels: {}
    status: not-implemented
    notes: ''
    verify: post-merge
    visual:
      states:
      - load-list-picker
      - invalid-list-errors
      interactions:
      - load-valid-list-and-play
  - id: record-ships
    capability: Gameplay
    acceptance: Each Record enters play as a mothership showing its display form and
      gloss, which on destruction releases a forms ship and one ship per example sentence.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R4
    levels:
      unit:
      - the-typist:tests/engine/world.test.ts
    status: skipped
    notes: Built in plan 1 phase 3 (+ operator-directed motion and sprites); World tests
      run locally; visual states captured headlessly in phase 3 review. No CI configured.
    visual:
      states:
      - mothership-with-gloss
      - escorts-spawned
      - locked-ship-typed-prefix
      interactions:
      - destroy-mothership-releases-escorts
  - id: typing-rules
    capability: Gameplay
    acceptance: Typing locks onto one ship, requires exact case and umlauts while accepting
      ae/oe/ue/ss and Mac dead-key input, and does not require final punctuation.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R5
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R6
    levels:
      unit:
      - the-typist:tests/engine/typing.test.ts
      - the-typist:tests/platform/keyboard.test.ts
    status: skipped
    notes: Built in plan 1 phase 3; engine and keyboard (jsdom composition) tests run
      locally; real dead-key composition verified via CDP IME in headless Chrome. No
      CI configured.
  - id: degraded-states
    capability: Gameplay
    acceptance: The game stays playable when nothing is due, when browser storage is
      unavailable, or when no German voice exists, telling the player what is limited.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R13
    levels: {}
    status: not-implemented
    notes: ''
    visual:
      states:
      - empty-study-offers-free-play
      - storage-warning-banner
      - tts-toggle-disabled-note
  - id: srs-sessions
    capability: Learning
    acceptance: Study sessions serve due plus capped new Records in category waves,
      free play covers a chosen category, and both reschedule Records via FSRS from
      typing performance.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R7
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R8
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R9
    levels: {}
    status: not-implemented
    notes: ''
  - id: learning-aids
    capability: Learning
    acceptance: Grammar chips, sentence translations, German TTS and post-wave recap
      cards are each available and individually switchable, and the choice persists.
    origin:
    - the-typist:docs/superpowers/specs/2026-10-05-vocab-typer-design.md#R10
    levels: {}
    status: not-implemented
    notes: ''
    visual:
