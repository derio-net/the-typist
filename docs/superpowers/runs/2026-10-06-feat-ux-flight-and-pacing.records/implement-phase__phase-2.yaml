journal:
  - {kind: discovery, id: p2-tdd-red-first, phase: 2, title: "Phase 2 was red-first with mutation checks", body: "Each task's tests were run and seen failing before the implementation. Mutants checked and killed: speak looked up in the new World instead of prev (needed a one-keystroke ship test, added), novelty/Google rank collapsed, de-DE order flipped, dropped list-change notify, preview gated on enabled, setVoice/startup wiring removed, Test not disabled with no voice. One equivalent mutant survives: a saved uri that is gone shows Automatic whether or not the panel checks, because a select assigned an unknown value reads empty."}
  - {kind: discovery, id: p2-stub-utterance, phase: 2, title: "A browser stub needs its own SpeechSynthesisUtterance", body: "The real utterance's voice setter throws for a plain-object voice, which createTts swallows, so a stub that only fakes getVoices silently speaks nothing. scripts/tmp/capture-voices.mjs stubs the utterance class too."}
  - {kind: discovery, id: p2-lock-covers-one-key, phase: 2, title: "A one-keystroke ship emits lock and destroyed in the same step", body: "typing emits lock before destroyed, so speaking on lock covers it, but only if the ship is looked up in prev; the app test uses an A. example (one keystroke, final stop pre-typed) to pin it."}
  - {kind: discovery, id: p2-removed-order-test, phase: 2, title: "The grading-before-speech test was removed", body: "It only asserted that say ran before anything else, which is vacuous once speech happens at lock; the throwing-say-on-lock test covers that speech failure cannot cost a grade."}
  - {kind: discovery, id: p2-no-voice-layout, phase: 2, title: "The no-voice reason squeezed the Test button onto two lines", body: "Seen in the screenshot; the reason now sits in its own line under the picker (a one-line change in settingsPanel)."}
