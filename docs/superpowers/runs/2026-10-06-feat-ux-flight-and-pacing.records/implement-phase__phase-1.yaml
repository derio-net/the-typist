journal:
  - kind: decision
    id: p1-speed-fixed-point
    title: Stack speed and reaction distance are solved by fixed-point iteration
    body: "R4 measures band distances at the apex, the apex depends on the kick, the kick on the speed, and rule 4 (reaction distance) on the speed again. The apex top is pinned at minY by construction, so the apex rise is max(0, y0 - above - minY) and needs no speed; only rule 4 is circular (speed depends on y, y bound depends on speed). placeStack iterates up to 40 times; the contraction ratio is minReactionS/(slack x budget) < 1 so it converges."
    phase: 1
  - kind: discovery
    id: p1-controller-test-order
    title: The old controller drive-through test typed ships[0] first
    body: "With longest-first stacks ships[0] is the top band, which the pace budget assumes is typed last. The test now types the lowest ship first (the natural order); the fast simulated typist otherwise lets the top bands escape."
    phase: 1
  - kind: discovery
    id: p1-neg-zero-kick
    title: A zero kick spawns vy = -0
    body: "spawn uses vy: -kick, so kick 0 gives -0; tests compare with Math.abs. Harmless to the simulation."
    phase: 1
