schema_version: 7
run: 2026-10-06-feat-ux-flight-and-pacing
step: spec-review
outcome: done
journal:
  - kind: finding
    id: sr-1
    review_scope: in
    title: Dropping placeStack rule 3 leaves the top band above the HUD for a high wreck; a kick of 0 cannot fix it
    body: "Evidence: world.ts:283-284, world.test.ts:536-539. Keep a rise-0 floor at spawn (top hull at or below minY), with rule 4 still winning."
  - kind: finding
    id: sr-2
    review_scope: in
    title: The kick is solved on continuous time but the World steps discretely, so the apex misses 4 px on large rises
    body: "Evidence: world.ts:334-339. tick() decays vy, then integrates, so the rise is about 1.8% short (about 7 px on 400 px). Solve on the step model and assert with tick()."
  - kind: finding
    id: sr-3
    review_scope: in
    title: The spec does not say what happens to burstKick or list the existing tests it breaks
    body: "Evidence: world.ts:31,267-287; world.test.ts:66-77,278-281,512,533-545; app.test.ts:477-487,629-635."
  - kind: finding
    id: sr-4
    review_scope: in
    title: R3's wording differs from the pace.ts formula, and R4 does not name its character count
    body: "Evidence: in the design the prior counts toward the 50, and a = c/(50+c) is an EMA, not a window. typing.ts:52-56: expectedChars = requiredLength."
  - kind: finding
    id: sr-5
    review_scope: in
    title: Two things are unspecified, when the pace updates on a mothership's destruction and how the saved pace enters a session
    body: "Evidence: world.ts:399-400 and controller.ts:84-87,148-149. Observe before spawnChildren; load once per session; the controller seeds the pace and overrides it on every wave."
  - kind: finding
    id: sr-6
    review_scope: in
    title: Speech on lock must look the ship up in prev, not the current World, and reactTo is at line 160
    body: "Evidence: app.ts:141-160; typing.ts:113-144. lock and destroyed can arrive in the same step."
  - kind: finding
    id: sr-7
    review_scope: in
    title: The TTS rework needs a wider SynthLike, re-ranking on every voiceschanged and the app applying settings.voice
    body: "Evidence: tts.ts:3, 50-57 and 59-69. Chrome adds Google Deutsch late. Add the tests."
  - kind: finding
    id: sr-8
    review_scope: in
    title: Importing during a paused session is unspecified, and the pace cannot be in the IndexedDB transaction
    body: "Evidence: app.ts:306-328, store.ts:113-169. Offer Export/Import only from the title screen's Settings; savePace after commit."
  - kind: finding
    id: sr-9
    review_scope: in
    title: In the E2E, clearing IndexedDB is blocked by the app's open connection
    body: "Evidence: store.ts:114-115, smoke.spec.ts:55-66. Clear the stores in a readwrite transaction instead."
  - kind: finding
    id: sr-10
    review_scope: in
    title: The supersession note omits plan 1's parts and the matrix rows to update
    body: "Evidence: plan-1 spec:26,232; plan-2 spec:175,278; matrix.yaml:137-138,312. Also add a post-merge row for the Test Plan."
  - kind: review
    id: spec-review-1
    title: "Spec review of 2026-10-06-ux-flight-and-pacing: 10 findings"
    body: |
      fr-spec-reviewer checked the spec against the brief, decisions q1–q7 and the codebase, with file:line evidence. It raised 10 findings, all in scope. The decisions are honoured, and the R4 bottom-up budget matches the typing engine's lowest-first lock (typing.ts:108-111).
resolves:
  - {id: sr-1, state: fixed, body: "Design adds rule 3, a rise-0 floor at spawn, with reaction distance still winning; tests cover a wreck just under the HUD."}
  - {id: sr-2, state: fixed, body: "The kick solve uses the discrete integrator's rise formula, and the tests assert the apex by running tick()."}
  - {id: sr-3, state: fixed, body: "burstKick is removed and kickDecayS kept as tau; Testing lists the world.test.ts and app.test.ts tests to rewrite or retire, with what replaces the vacuous one."}
  - {id: sr-4, state: fixed, body: "R3 is reworded: the prior does not count toward 50, and the average is exponentially weighted with an effective window of 50. The pace.ts formula matches, and R4 names requiredLength."}
  - {id: sr-5, state: fixed, body: "R4 and the design say the sample is observed before spawnChildren; loadPace runs once per session; the controller seeds the pace and overrides it on every wave."}
  - {id: sr-6, state: fixed, body: "The design looks the ship up in prev, R6 covers a lock and destroy in one keystroke, the line references are fixed and a test is added."}
  - {id: sr-7, state: fixed, body: "SynthLike is widened; voiceschanged is always subscribed and re-ranks; onChange fires on list changes; the app applies settings.voice; tests are added."}
  - {id: sr-8, state: fixed, body: "R10 offers Export/Import only from the title screen's Settings; cards and counts merge in one transaction, and the pace is saved after commit."}
  - {id: sr-9, state: fixed, body: "The E2E clears the cards and meta stores in a readwrite transaction and imports the downloaded file through the file input."}
  - {id: sr-10, state: fixed, body: "The Goal lists the superseded plan-1 and plan-2 parts and the matrix rows to update; a post-merge row covers the Test Plan."}
