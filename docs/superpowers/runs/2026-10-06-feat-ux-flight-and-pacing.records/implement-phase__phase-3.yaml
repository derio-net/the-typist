journal:
  - {kind: discovery, id: p3-idb-await-rule, phase: 3, title: "IDB import awaits only IndexedDB requests", body: "importAll reads each local card with done(get) inside the readwrite transaction and puts after it; the file is parsed and validated in app.ts before the transaction opens, and savePace runs only after importAll resolves. A mutant that skips tx.abort() on a mid-import failure is killed by the one-transaction test (an uncloneable card is the injected failure, in both stores)."}
  - {kind: discovery, id: p3-persist-nonblocking, phase: 3, title: "persist() is not awaited at startup", body: "Firefox may show a prompt for persist(), so startApp does not wait for it: it is tracked via track() and the Settings panel re-renders when the answer arrives. Status is protected when persist() or persisted() is true, else may-be-cleared; memory stores never call it."}
  - {kind: discovery, id: p3-surviving-mutant, phase: 3, title: "A meta-key range mutant survived until a stray-key test", body: "Removing the ['new'] key range from the IDB meta cursor survived because the probe key is deleted after use. Added a test that writes stray string meta keys through the raw factory; the mutant is now killed. The picker.value reset after a file choice has no unit test (jsdom cannot assert it)."}
