  - {id: p1-r3, state: fixed, body: "d863b5c: rule 4 caps the shared speed to the room before lifting, and lifts only when the stack is too tall at minSpeed. The test at spc 0.05 from wrecks at 450 and at the entry y fails before the fix. The spec is updated (377b4c3)."}
  - {id: p1-r4, state: fixed, body: "b62a92c adds the app.test.ts level; reports regenerated and fr acceptance check passes (377b4c3)."}
  - {id: p1-r5, state: fixed, body: "b0d8221: 120 is labelled as the floor case, and kick > 0 is asserted for 300 and 520."}
