    '
resolves:
- id: sr-1
  state: fixed
  body: 'R5 and Sessions: the between-wave panel shows after every wave, including the last, before the summary. R6: recap
    cards cover that wave''s Again or Hard Records. R19: forces a Hard grade with typos, and checks the recap card, then the
    summary, then FSRS cards for both Records.'
- id: sr-2
  state: fixed
  body: 'R4: at 0 lives, every on-screen Record with an escaped ship is graded Again, and the others stay ungraded; on quit,
    on-screen Records stay ungraded. Sessions: on game-over the World emits resolved (escaped: true) for those Records before
    the summary. Testing: covers game-over grading.'
- id: sr-3
  state: fixed
  body: 'R16 and the split section: the metrics, hullSprite, hullExtent, the sprite types and sprite-atlas.json move to src/layout/;
    slice.ts writes the atlas there; engine depends only on layout; a Vitest import-boundary test is added.'
- id: sr-4
  state: fixed
  body: 'Loading: records are validated against RecordBase plus checkEnriched(r, header rules); if the header fails, the default
    minimums apply and its errors are reported. R9 now lists unique category ids.'
- id: sr-5
  state: fixed
  body: WorldOptions gains aids; rows that are off are not attached, so they don't widen the hull or take band height; a test
    is added.
- id: sr-6
  state: fixed
  body: 'WorldOptions.width is fixed per World, picked by the controller at wave start (aspect × 640, clamped to 720-1280);
    a mid-wave resize only rescales the canvas. Placement is restated against the existing clamps: the apex hull top stays
    at or below minY, spacing uses shipBounds plus bandGap, reaction distance still wins, and the fallback reduces the kick.
    R13 is reworded to match.'
- id: sr-7
  state: fixed
  body: 'R11 and Play feel: a named WORLD.playerDriftVx = burstMaxVx (22 px/s) keeps pace with the fastest child; playerX
    becomes World state.'
- id: sr-8
  state: fixed
  body: 'Module layout lists keyboard.ts as changed: setEnabled(on), which disables emitting and refocusing, and an onEscape
    callback. app.ts disables it while panels are open. The jsdom test covers a control that keeps focus.'
- id: sr-9
  state: fixed
  body: Hosting lists the Playwright install and npm run e2e against vite preview before deploy; Module layout adds playwright.config.ts
    and the e2e script.
- id: sr-10
  state: fixed
  body: 'R2: new Records fill the cap in list order, and categories are ordered by their most overdue card. R3: Records whose
    categories include the chosen category (primary or not), shuffled.'
- id: sr-11
  state: fixed
  body: 'What exists names the real fields and the current imports; the cards counters are defined against the boolean escaped.
    The archived plan-1 spec is NOT edited; the sibling-speed rule for issue #4 p3-r17 is stated in this spec, citing spawnChildren.'
- id: sr-12
  state: fixed
  body: Testing names unit tests for game-over grading, the builders' ordering and cap, the free-play cap counter, placement
    and the fallback, the drift cap, gun alternation, width and aids options, the flash and prefix helpers, the DPR backing
    store, the import boundary, the zero-playable list and panel focus; visual results go to the play-feel and session-screens
    screenshots.
- id: sr-13
  state: fixed
  body: Restored the full text of ux-pass-is-issue-2, issues-in-scope and design-defaults in the spec journal from the brainstorm
    record's intended content.
