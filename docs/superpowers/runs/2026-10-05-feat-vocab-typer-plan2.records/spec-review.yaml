- kind: review
  id: spec-review-1
  title: 'independent spec review: 13 findings'
  body: 'Reviewed docs/superpowers/specs/2026-10-06-vocab-typer-plan2-design.md against the journal decisions, the codebase
    (file:line verified for the World events, WorldOptions, matchChar, PRETYPED, typeable.ts, parseList, theme.ts metrics,
    the vite list plugin and the validate CLI), and itself. Raised 13 findings, all in scope: sr-1..sr-13. The decisions are
