      interactions:
        - esc-pause-then-resume-keeps-typing-focus
        - study-session-runs-to-summary
        - session-ends-at-zero-lives
  - id: game-audio
    capability: Gameplay
    acceptance: Play has sound effects for hits, typos, explosions, escapes, cleared waves and entering motherships, plus looping music when a track is supplied, each switchable and remembered.
    origin:
