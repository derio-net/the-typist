    capability: Gameplay
    acceptance: The player ship fires from its front guns and drifts toward its target, typos and pending ae/oe/ue/ss prefixes are visible on the locked ship, and the playfield stays sharp, fits narrow windows and never hides the HUD.
    origin:
      - the-typist:docs/superpowers/specs/2026-10-06-vocab-typer-plan2-design.md#R11
      - the-typist:docs/superpowers/specs/2026-10-06-vocab-typer-plan2-design.md#R12
