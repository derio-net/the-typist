      states:
        - bullets-leave-front-guns
        - player-tracks-locked-ship
        - typo-flash-on-locked-ship
        - pending-digraph-prefix-shown
        - narrow-window-fit-no-horizontal-scroll
        - released-ships-clear-of-hud
      interactions:
        - lock-then-player-drifts-to-target
  - id: typing-edge-cases
    capability: Gameplay
    acceptance: A precomposed umlaut typed mid-digraph is accepted, closing quotes and brackets at a sentence end need not be typed, and loanwords with accented letters are typeable with the accent or its base letter.
    origin:
      - the-typist:docs/superpowers/specs/2026-10-06-vocab-typer-plan2-design.md#R14
      - the-typist:docs/superpowers/specs/2026-10-06-vocab-typer-plan2-design.md#R15
    status: not-implemented
  - id: list-errors-one-pass
    capability: Lists
    acceptance: An invalid list reports all its record-level and list-level errors together, so its author can fix everything in one pass.
    origin:
      - the-typist:docs/superpowers/specs/2026-10-06-vocab-typer-plan2-design.md#R9
    status: not-implemented
