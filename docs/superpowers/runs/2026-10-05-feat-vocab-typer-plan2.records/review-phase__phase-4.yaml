    pause clock, a single loop after quit, and no XSS path. Important: p4-r1 next wave keeps the old width; p4-r2 banner hides
    the HUD. Minor p4-r3..p4-r10. All fixed in 5917fbd, ff8f439, 84c2074, 1ba7045 and b15bc76; the suite (450 tests) and the
    build are green.

    '
