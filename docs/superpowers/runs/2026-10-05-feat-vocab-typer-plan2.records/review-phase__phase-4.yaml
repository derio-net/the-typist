  body: 'Independent reviewer read ffa42cd..1d163ad (R4 wiring, R5, R8, R10), ran npm test, and drove the UI itself with review-p4.js,
    including limit cases (Esc spam, cap 0/99/abc, non-YAML/binary/empty files, hostile strings, resize between waves, quit
