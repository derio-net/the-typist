  - {kind: decision, id: p3-engine-api, phase: 3, title: "Engine and world API shapes", body: "TypingEngine is step(state, char, now) over TypingState {ships, lock, typos}; ships carry y (largest = closest to the player) and the world syncs y each tick. Trailing pre-typed punctuation = . ! ? … and closing quotes, never the whole text. World is immutable-style: tick/typeChar/advance return a new World with `events` for the last call; RecordStats.escaped is a boolean; expectedChars counts destroyed ships only (an escaped mothership contributes 0). Motherships all spawn on screen in staggered lanes so the offscreen is never targetable."}
  - {kind: discovery, id: p3-composition-echo, phase: 3, title: "Composition echo guard", body: "keyboard.ts ignores input events whose inputType is insertCompositionText or insertFromComposition, so a browser that echoes the composed char as a non-composing input after compositionend (Safari-style) is not double-counted. Tested synthetically only; real macOS Safari/Chrome ordering is unverified."}
